<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Store | Cart</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

    <a class="brand" href="index.html">SimpleStore</a>
    <nav class="nav">
