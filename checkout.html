<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Store | Checkout</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="header">
    <a class="brand" href="index.html">SimpleStore</a>
    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="cart.html">Cart <span id="cart-count">0</span></a>
      <a href="login.html" id="auth-link">Login</a>
    </nav>
  </header>

  <main class="container" id="checkout-page">
    <h1>Checkout</h1>

    <div class="checkout-layout">
      <section class="checkout-summary-box">
        <h2>Order summary</h2>
        <section id="checkout-summary"></section>
      </section>

      <section class="checkout-form-wrapper">
        <h2>Shipping details</h2>
        <form id="checkout-form">
          <div class="form-control">
            <label for="fullName">Full name</label>
            <input id="fullName" name="fullName" type="text" required />
          </div>

          <div class="form-control">
            <label for="address">Address</label>
            <textarea id="address" name="address" required></textarea>
          </div>

          <div class="form-control">
            <label for="city">City</label>
            <input id="city" name="city" type="text" required />
          </div>

          <div class="form-control">
            <label for="zip">ZIP / Postal code</label>
            <input id="zip" name="zip" type="text" required />
          </div>

          <div class="form-control">
            <label for="card">Card number (demo)</label>
            <input id="card" name="card" type="text" placeholder="1111 2222 3333 4444" />
          </div>

          <button type="submit" class="btn primary" style="width:100%;">Place order</button>
          <p class="small-text">This is a demo. No real payment is processed.</p>
        </form>
      </section>
    </div>
  </main>

  <footer class="footer">© 2025 SimpleStore</footer>
  <script src="app.js"></script>
</body>
</html>
