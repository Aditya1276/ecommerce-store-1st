<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Store | Home</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="header">
    <a class="brand" href="index.html">SimpleStore</a>
    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="cart.html">Cart <span id="cart-count">0</span></a>
      <a href="login.html" id="auth-link">Login</a>
    </nav>
  </header>

  <main class="container">
    <section class="hero">
      <h1>Find what you love</h1>
      <p>Curated products with clean design.</p>
    </section>

    <section class="search-bar">
      <input
        type="search"
        id="search-input"
        class="search-input"
        placeholder="Search products by name or category..."
        aria-label="Search products"
      />
    </section>

    <section class="grid" id="product-grid" aria-live="polite">
    </section>
  </main>

  <footer class="footer">© 2025 SimpleStore</footer>
  <script src="app.js"></script>
</body>
</html>
